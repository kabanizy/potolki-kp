<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>КП — сайт готовится к запуску</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #172033; }
    main { max-width: 42rem; margin: 2rem; padding: 3rem; border-radius: 1.5rem; background: #fff; box-shadow: 0 1rem 3rem rgba(23, 32, 51, .12); }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1; }
    p { margin: 0; font-size: 1.125rem; line-height: 1.6; color: #536077; }
  </style>
</head>
<body>
  <main>
    <h1>Сайт готовится к запуску</h1>
    <p>Сервер и защищённое соединение настроены. Здесь скоро появится сервис подготовки коммерческих предложений.</p>
  </main>
</body>
</html>
