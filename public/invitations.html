<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Коды приглашений</title><link rel="stylesheet" href="/account.css"><main><nav></nav><h1>Коды приглашений</h1><div id="message" class="message" role="status"></div><button id="create">Создать код</button><section class="card table-wrap"><table><thead><tr><th>Код</th><th>Статус</th><th>Создан</th><th>Использован</th><th>Пользователь</th><th>Действия</th></tr></thead><tbody id="list"></tbody></table></section></main><script src="/account.js"></script><script>
async function load(){const rows=await request('/api/invitations');document.getElementById('list').innerHTML=rows.map(x=>`<tr><td><code>${htmlEscape(x.code)}</code></td><td>${x.used_at?'Использован':x.active?'Активен':'Отключён'}</td><td>${htmlEscape(x.created_at)}</td><td>${htmlEscape(x.used_at||'—')}</td><td>${htmlEscape(x.used_name||'—')}</td><td><div class="actions">${!x.used_at?`<button class="ghost" onclick="toggleCode(${x.id},${!x.active})">${x.active?'Отключить':'Активировать'}</button>`:''}<button class="danger" onclick="removeCode(${x.id})">Удалить</button></div></td></tr>`).join('')}
document.getElementById('create').onclick=async()=>{try{const x=await request('/api/invitations','POST',{});await load();message('Код создан: '+x.code)}catch(e){message(e.message,true)}};
async function toggleCode(id,active){try{await request('/api/invitations/'+id,'PUT',{active});await load()}catch(e){message(e.message,true)}}
async function removeCode(id){if(!confirm('Удалить код? Зарегистрированный пользователь сохранится.'))return;try{await request('/api/invitations/'+id,'DELETE');await load()}catch(e){message(e.message,true)}}
accountReady().then(load).catch(e=>message(e.message,true));
</script></html>
