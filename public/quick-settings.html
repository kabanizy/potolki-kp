<!doctype html>
<html lang="ru">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Настройки быстрого расчёта</title>
<link rel="stylesheet" href="/account.css">
<main>
  <nav></nav>
  <h1>Настройки быстрого расчёта</h1>
  <p class="page-intro">Для каждой строки можно выбрать категорию прайса, закрепить одну позицию или добавить собственные варианты только для быстрого расчёта. Если вариант не выбран, менеджер вводит количество и цену вручную, а в КП используется общее название строки.</p>
  <div id="message" class="message" role="status"></div>
  <section class="card">
    <div id="rows"></div>
    <div class="actions"><button id="add">Добавить строку</button></div>
  </section>
</main>
<script src="/account.js"></script>
<script>
let settings=[],prices=[],busy=false;
const current=id=>settings.find(x=>Number(x.id)===Number(id));
const optionsFor=row=>row.section_id?prices.filter(s=>s.id===Number(row.section_id)).flatMap(s=>s.items).filter(x=>x.name!=='Установка полотна'):[];
function optionRows(row){const options=row.custom_options||[];return `<div class="custom-options"><div class="custom-options-head"><div><strong>Свои позиции</strong><div class="muted">Они доступны только в этой строке быстрого расчёта. Цена подставляется по умолчанию.</div></div><button type="button" class="ghost small" data-add-option="${row.id}">Добавить свою позицию</button></div>${options.length?options.map((o,index)=>`<div class="custom-option-row"><label>Название<input data-option-field="name" data-option-index="${index}" value="${htmlEscape(o.name)}"></label><label>Ед.<input data-option-field="unit" data-option-index="${index}" value="${htmlEscape(o.unit||'шт')}"></label><label>Цена по умолчанию, ₽<input data-option-field="price" data-option-index="${index}" type="number" min="0" step="0.01" value="${Number(o.price)||0}"></label><button type="button" class="danger small" data-remove-option="${index}">Удалить</button></div>`).join(''):'<div class="muted custom-options-empty">Своих позиций пока нет.</div>'}</div>`}
function render(){document.getElementById('rows').innerHTML=settings.map((r,i)=>{const variants=optionsFor(r);return `<article class="quick-setting-card" data-id="${r.id}"><div class="quick-setting-fields"><label>Название строки<input data-field="name" value="${htmlEscape(r.name)}"></label><label>Категория прайса<select data-field="section_id"><option value="">Без позиций прайса</option>${prices.map(s=>`<option value="${s.id}" ${s.id===Number(r.section_id)?'selected':''}>${htmlEscape(s.name)}</option>`).join('')}</select></label><label>Закреплённая позиция<select data-field="price_item_id" ${r.section_id?'':'disabled'}><option value="">Выбирается в расчёте</option>${variants.map(x=>`<option value="${x.id}" ${x.id===Number(r.price_item_id)?'selected':''}>${htmlEscape(x.name)}</option>`).join('')}</select></label><label>Источник цены<select data-field="price_source"><option value="catalog" ${r.price_source==='catalog'?'selected':''}>Из выбранной позиции</option><option value="manual" ${r.price_source==='manual'?'selected':''}>Вводится вручную</option></select></label><label>Раздел КП<select data-field="calc_group"><option value="services" ${r.calc_group==='services'?'selected':''}>Услуги и материалы</option><option value="canvas" ${r.calc_group==='canvas'?'selected':''}>Полотна</option><option value="products" ${r.calc_group==='products'?'selected':''}>Товары</option></select></label><label>Порядок<input data-field="sort_order" type="number" min="1" max="${settings.length}" value="${i+1}"></label><button type="button" class="danger" data-remove-setting="${r.id}">Удалить строку</button></div>${optionRows(r)}</article>`}).join('')||'<p>Строк пока нет.</p>'}
function lock(value){busy=value;document.querySelectorAll('#rows input,#rows select,#rows button,#add').forEach(el=>el.disabled=value||el.dataset.field==='price_item_id'&&!el.closest('[data-id]')?.querySelector('[data-field="section_id"]')?.value)}
async function saveRow(id,data,notice='Сохранено'){lock(true);try{settings=(await request('/api/quick-settings/'+id,'PUT',data)).rows;render();message(notice)}catch(e){message(e.message,true);render()}finally{lock(false)}}
document.getElementById('rows').onchange=async e=>{if(busy)return;const card=e.target.closest('[data-id]');if(!card)return;const id=Number(card.dataset.id),source=current(id);if(e.target.dataset.optionField){const options=(source.custom_options||[]).map(x=>({...x})),index=Number(e.target.dataset.optionIndex),key=e.target.dataset.optionField;options[index][key]=key==='price'?Number(e.target.value):e.target.value;return saveRow(id,{...source,custom_options:options})}const key=e.target.dataset.field;if(!key)return;const data={...source};data[key]=key==='sort_order'?Number(e.target.value)-1:e.target.value;if(key==='section_id')data.price_item_id=null;await saveRow(id,data)};
document.getElementById('rows').onclick=async e=>{if(busy)return;const card=e.target.closest('[data-id]'),id=Number(card?.dataset.id);if(e.target.dataset.addOption){const row=current(id),options=[...(row.custom_options||[]),{id:'opt_'+Date.now().toString(36),name:'Новая позиция',unit:'шт',price:0}];return saveRow(id,{...row,custom_options:options},'Своя позиция добавлена')}if(e.target.dataset.removeOption!==undefined){const row=current(id),index=Number(e.target.dataset.removeOption),options=(row.custom_options||[]).filter((_,i)=>i!==index);return saveRow(id,{...row,custom_options:options},'Своя позиция удалена')}if(e.target.dataset.removeSetting){lock(true);try{settings=(await request('/api/quick-settings/'+id,'DELETE')).rows;render();message('Строка удалена; порядок сохранён')}catch(err){message(err.message,true)}finally{lock(false)}}};
document.getElementById('add').onclick=async()=>{if(busy)return;lock(true);try{settings=(await request('/api/quick-settings','POST',{name:'Новая позиция',price_source:'manual',calc_group:'services',custom_options:[]})).rows;render();message('Строка добавлена и сохранена')}catch(e){message(e.message,true)}finally{lock(false)}};
accountReady().then(async()=>{prices=await request('/api/prices');settings=await request('/api/quick-settings');render()}).catch(e=>message(e.message,true));
</script>
</html>
