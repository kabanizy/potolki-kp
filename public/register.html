<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация менеджера</title><link rel="stylesheet" href="/account.css"><main class="auth"><section class="card"><a class="brandmark" href="/login" aria-label="Потолочная №1 — вход"><span class="brand-logo">№1</span><span class="brandname"><span>Калькулятор тарифов</span><strong>Потолочная №1</strong></span></a><h1>Регистрация менеджера</h1><p class="page-intro">Для регистрации понадобится код приглашения от администратора.</p><div class="message error" id="message" role="alert"></div><form action="/register" method="post"><label for="name">Имя</label><input id="name" name="name" autocomplete="name" required maxlength="120"><label for="login">Логин</label><input id="login" name="login" autocomplete="username" required pattern="[a-zA-Z0-9_.@\-]{3,80}"><label for="password">Пароль — от 8 символов</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><label for="code">Код-приглашение</label><input id="code" name="code" required autocomplete="off" maxlength="80"><button class="red">Зарегистрироваться</button></form><div class="auth-divider">Уже есть аккаунт?</div><a class="btn ghost auth-secondary" href="/login">Вернуться ко входу</a></section></main><script src="/auth.js"></script></html>
